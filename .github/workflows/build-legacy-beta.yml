name: Build IT Digitacao Legacy beta
on:
  workflow_dispatch:
  push:
    branches: [legacy/net35-full]
    paths:
      - 'src/ITDigitacao.Legacy.Core/**'
      - 'src/ITDigitacao.Legacy.App/**'
      - 'src/ITDigitacao.Legacy.Shortcut/**'
      - 'scripts/build-legacy-core.ps1'
      - 'scripts/build-legacy-beta.ps1'
      - '.github/workflows/build-legacy-beta.yml'
      - 'docs/legacy/**'
      - 'tests/legacy-beta-smoke.ps1'
      - 'tests/legacy-layout-smoke.cs'
jobs:
  beta:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Restore .NET 3.5 references
        shell: pwsh
        run: |
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net35 -Version 1.0.3 -OutputDirectory packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'Restore .NET 3.5 references failed.' }
          $refs=(Resolve-Path 'packages/Microsoft.NETFramework.ReferenceAssemblies.net35.1.0.3/build/.NETFramework/v3.5').Path
          foreach($n in 'mscorlib.dll','System.ServiceModel.Web.dll'){if(!(Test-Path (Join-Path $refs $n))){throw "Missing .NET 3.5 reference: $n"}}
          "FrameworkPathOverride=$refs" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compile, verify and package fresh outputs
        shell: powershell
        run: .\scripts\build-legacy-beta.ps1
      - name: Run Core, catalog and typing smoke tests
        shell: pwsh
        run: |
          & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File .\tests\legacy-beta-smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Legacy beta smoke tests failed.' }
      - name: Run Legacy WPF layout smoke tests
        shell: powershell
        run: |
          $extract=Join-Path $env:RUNNER_TEMP 'legacy-beta-integrity'
          $testExe=Join-Path $extract 'legacy-layout-smoke.exe'
          $ErrorActionPreference='Continue'
          $framework=Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319'
          $wpf=Join-Path ${env:ProgramFiles(x86)} 'Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8'
          $compilerArgs=@('/nologo','/platform:x86',"/out:$testExe")
          foreach($reference in 'WindowsBase','PresentationCore','PresentationFramework','System.Xaml'){
            $compilerArgs+="/reference:$wpf\$reference.dll"
          }
          $testSource=(Resolve-Path -LiteralPath 'tests\legacy-layout-smoke.cs').Path
          $diagnostics=@(& (Join-Path $framework 'csc.exe') @compilerArgs $testSource 2>&1)
          $result=$LASTEXITCODE
          $diagnostics | Out-Host
          if ($result -ne 0) {
            $diagnostics | ForEach-Object { Write-Host "::error title=Legacy layout compilation::$_" }
            exit $result
          }
          $diagnostics=@(& $testExe 2>&1)
          $result=$LASTEXITCODE
          $diagnostics | Out-Host
          if ($result -ne 0) {
            $diagnostics | ForEach-Object { Write-Host "::error title=Legacy layout test::$_" }
            exit $result
          }
      - name: Generate ZIP SHA-256
        shell: pwsh
        run: |
          $zip='IT-Digitacao-Legacy-2.0.0-beta.3-Portable-x86.zip'
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$zip" | Set-Content SHA256SUMS.txt -Encoding ascii
      - name: Upload portable beta
        uses: actions/upload-artifact@v4
        with:
          name: IT-Digitacao-Legacy-2.0.0-beta.3-Portable-x86
          path: |
            IT-Digitacao-Legacy-2.0.0-beta.3-Portable-x86.zip
            SHA256SUMS.txt
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/legacy/net35-full'
    needs: beta
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: IT-Digitacao-Legacy-2.0.0-beta.3-Portable-x86
      - name: Publish verified Legacy pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check SHA256SUMS.txt
          gh release create v2.0.0-beta.3-legacy --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "IT Digitação Legacy 2.0.0-beta.3" \
            --notes "Ajustes de responsividade na janela e no editor da edição Legacy (.NET Framework 3.5, x86)." \
            IT-Digitacao-Legacy-2.0.0-beta.3-Portable-x86.zip SHA256SUMS.txt
