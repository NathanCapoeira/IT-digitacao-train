name: Build IT Digitação Legacy Test
on:
  workflow_dispatch:
  push:
    branches: [legacy/**]
    paths:
      - 'src/ITDigitacao.Legacy.Test/**'
      - 'scripts/build-legacy.ps1'
      - '.github/workflows/build-legacy.yml'
jobs:
  build-legacy:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Restore .NET 3.5 reference assemblies and verify WPF targets
        shell: pwsh
        run: |
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net35 -Version 1.0.3 -OutputDirectory packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'Could not restore .NET 3.5 reference assemblies.' }
          $refs = Resolve-Path 'packages/Microsoft.NETFramework.ReferenceAssemblies.net35.1.0.3/build/.NETFramework/v3.5'
          if (-not (Test-Path (Join-Path $refs 'mscorlib.dll'))) { throw 'Reference package did not contain the .NET 3.5 reference assemblies.' }
          "FrameworkPathOverride=$refs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $msbuildDir = Split-Path (Get-Command MSBuild.exe).Source
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsRoot = & $vswhere -latest -products '*' -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vsRoot) { throw 'Could not resolve Visual Studio installation with vswhere.' }
          $searchRoots = @((Join-Path $vsRoot 'MSBuild'), (Join-Path $msbuildDir '..')) | ForEach-Object { [IO.Path]::GetFullPath($_) } | Select-Object -Unique
          $winfx = @($searchRoots | ForEach-Object { Get-ChildItem -LiteralPath $_ -Filter Microsoft.WinFX.targets -File -Recurse -ErrorAction SilentlyContinue }) | Select-Object -First 1
          if (-not $winfx) { throw "WPF target Microsoft.WinFX.targets was not found below: $($searchRoots -join ', ')" }
          "WinFXTargetsPath=$($winfx.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved WPF targets: $($winfx.FullName)"
      - name: Build Legacy x86 Release
        shell: pwsh
        run: .\scripts\build-legacy.ps1
      - name: Verify CLR target and package
        shell: pwsh
        run: |
          $exe = 'src/ITDigitacao.Legacy.Test/bin/x86/Release/ITDigitacao.Legacy.Test.exe'
          if (-not (Test-Path $exe)) { throw 'Fresh build executable missing.' }
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $exe))
          $text = [Text.Encoding]::ASCII.GetString($bytes)
          if ($text -notmatch 'v2\.0\.50727') { throw 'Executable metadata does not identify CLR 2.0.' }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item $exe package/
          Copy-Item src/ITDigitacao.Legacy.Test/Assets/logo-instituto.png package/
          @'
          IT Digitacao Legacy Test
          .NET Framework 3.5 / CLR 2.0 / x86
          No runtime assemblies are bundled. Target PC must already provide .NET 3.5.
          '@ | Set-Content package/LEIA-ME.txt -Encoding UTF8
          Compress-Archive -Path package/* -DestinationPath IT-Digitacao-Legacy-Test.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: IT-Digitacao-Legacy-Test
          path: IT-Digitacao-Legacy-Test.zip
          if-no-files-found: error
