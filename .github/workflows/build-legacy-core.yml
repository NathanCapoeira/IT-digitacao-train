name: Build ITDigitacao Legacy Core
on:
  workflow_dispatch:
  push:
    branches: [legacy/net35-full]
    paths:
      - 'src/ITDigitacao.Legacy.Core/**'
      - 'scripts/build-legacy-core.ps1'
      - '.github/workflows/build-legacy-core.yml'
jobs:
  build-core:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Restore .NET 3.5 reference assemblies
        shell: powershell
        run: |
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net35 -Version 1.0.3 -OutputDirectory packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'Could not restore .NET 3.5 reference assemblies.' }
          $refs = (Resolve-Path 'packages/Microsoft.NETFramework.ReferenceAssemblies.net35.1.0.3/build/.NETFramework/v3.5').Path
          if (-not (Test-Path (Join-Path $refs 'mscorlib.dll'))) { throw 'NuGet .NET 3.5 reference assemblies are incomplete.' }
          if (-not (Test-Path (Join-Path $refs 'System.ServiceModel.Web.dll'))) { throw 'NuGet .NET 3.5 references lack System.ServiceModel.Web.dll required by the JSON serializer.' }
          "FrameworkPathOverride=$refs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Legacy Core Release x86
        shell: pwsh
        run: .\scripts\build-legacy-core.ps1
      - name: Verify target and publish assembly artifact
        shell: powershell
        run: |
          $dll = 'src/ITDigitacao.Legacy.Core/bin/x86/Release/ITDigitacao.Legacy.Core.dll'
          if (-not (Test-Path $dll)) { throw 'Legacy Core output is missing.' }
          $asm = [Reflection.Assembly]::ReflectionOnlyLoadFrom((Resolve-Path $dll).Path)
          if ($asm.ImageRuntimeVersion -ne 'v2.0.50727') { throw "Expected CLR 2.0, got $($asm.ImageRuntimeVersion)" }
          New-Item -ItemType Directory -Force -Path legacy-core-artifact | Out-Null
          Copy-Item $dll legacy-core-artifact/
          Get-FileHash $dll -Algorithm SHA256 | Format-List | Out-File legacy-core-artifact/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ITDigitacao-Legacy-Core-net35-x86
          path: legacy-core-artifact/
          if-no-files-found: error
