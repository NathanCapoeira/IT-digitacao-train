name: Build do IT Digitação

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: WPF · Release x86
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Compilar e preparar distribuição
        shell: powershell
        run: |
          cmd.exe /d /c 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\build.ps1 > "%RUNNER_TEMP%\it-build.log" 2>&1'
          $result = $LASTEXITCODE
          $log = Get-Content -LiteralPath "$env:RUNNER_TEMP\it-build.log"
          $log | Write-Host
          if ($result -ne 0) {
            $log | Select-String -Pattern 'error|erro|failed|not found' | Select-Object -First 12 | ForEach-Object { Write-Host "::error::$($_.Line)" }
            exit $result
          }

      - name: Verificar distribuição e registrar o commit
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-Item -LiteralPath '.\dist\IT-Digitacao.exe'
          if ($exe.Length -eq 0) { throw 'O executável está vazio.' }
          $commit = git rev-parse --verify HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível identificar o commit compilado.' }
          @("Commit: $commit", 'Configuração: Release', 'Plataforma: x86', 'Framework: .NET Framework 4.8') |
            Set-Content -LiteralPath '.\dist\build-info.txt' -Encoding UTF8

      - name: Testar catálogo e motor de digitação
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $messages = & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -STA -File .\tests\smoke-core.ps1 -Distribution .\dist 2>&1
          $result = $LASTEXITCODE
          $messages | Out-Host
          if ($result -ne 0) {
            $messages | Select-Object -First 14 | ForEach-Object { Write-Host "::error::$_" }
            exit $result
          }

      - name: Validar interface WPF e gerar captura
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $messages = & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -STA -File .\tests\smoke-wpf.ps1 -Executable .\dist\IT-Digitacao.exe -CaptureDirectory .\captures 2>&1
          $result = $LASTEXITCODE
          $messages | Out-Host
          if ($result -ne 0) {
            $messages | Select-Object -First 14 | ForEach-Object { Write-Host "::error::$_" }
            exit $result
          }

      - name: Publicar capturas WPF
        uses: actions/upload-artifact@v4
        with:
          name: IT-Digitacao-Captura-WPF-${{ github.sha }}
          path: captures/
          if-no-files-found: error

      - name: Publicar pacote Windows
        uses: actions/upload-artifact@v4
        with:
          name: IT-Digitacao-Train-1.3.0-Release
          path: dist/
          if-no-files-found: error
